<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petri Dash Vault</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=JetBrains+Mono:wght@400;600&display=swap">
<style id="cssVault">
/* Layout: one column of game chrome around specimen stages (model canvases, alignment rows, family cards).
   Skin: the same cartridge-era console as Petri Dash, on purpose a single dark look: deep indigo, cream ink, coin-yellow accent, chunky black frames, pixel type.
   Persimmon still marks what the player flags; green, amber and red still carry feedback. Residue letters keep a plain monospace so they stay legible. */
:root {
  color-scheme: dark;
  --bg: #14112a; --panel: #27224a; --panel2: #373067; --ink: #f6f1dd; --mute: #b8b1d6; --line: #5c5592; --edge: #090714; --stage: #0d0a1e; --soft: #1c1838;
  --blade: #ffd23f; --on-blade: #2a1a00; --sky: #5ad1ff; --hot: #ff6b5d; --ok: #5be37d; --warn: #ffb347; --isdark: 1;
  --good-bg: #12402a; --good-ink: #a6f5c0; --mid-bg: #4a3a10; --mid-ink: #ffe08a; --bad-bg: #4a1a1a; --bad-ink: #ffc2b8; --info-bg: #1b2a5e; --info-ink: #c5d6ff; --gold: #ffd23f; --gold-edge: #b87a0a;
  --f-display: "Press Start 2P", "Courier New", monospace; --f-body: "VT323", "Courier New", monospace; --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r-s: 0px; --r-m: 0px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 14px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.mute { color: var(--mute); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-s); padding: 8px 14px; font-weight: 600; min-height: 40px; }
.btn:hover:not(:disabled) { border-color: var(--blade); }
.btn.pri { background: var(--blade); color: var(--on-blade); border-color: var(--blade); }
.btn.big { min-height: 52px; font-size: 1.1rem; padding: 12px 28px; border-radius: 12px; font-family: var(--f-display); }
.btn[aria-pressed="true"] { background: var(--blade); color: var(--on-blade); border-color: var(--blade); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .seg button:focus-visible, input:focus-visible { outline: 2px solid var(--blade); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-s); overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 8px 12px; min-height: 40px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--blade); color: var(--on-blade); }
.seg button + button { border-left: 1px solid var(--line); }

/* start screen */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; display: flex; align-items: center; gap: 10px; }
.brand svg { width: 26px; height: 26px; flex: none; }
.start { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.start h1 { font-size: clamp(1.9rem, 5vw, 2.9rem); line-height: 1.02; margin-bottom: 12px; }
.lede { max-width: 56ch; color: var(--mute); margin: 0 0 16px; }
.how { display: grid; gap: 10px; margin: 0 0 18px; padding: 0; list-style: none; }
.how li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; }
.how svg { width: 34px; height: 34px; }
.how b { display: block; font-family: var(--f-display); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-m); padding: 16px; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > label, .field > .lab { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--mute); font-weight: 600; }
input[type="text"] { font: inherit; background: var(--soft); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-s); padding: 8px 10px; min-height: 40px; width: 100%; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 16px; }
.stats div { background: var(--soft); border: 1px solid var(--line); border-radius: var(--r-s); padding: 8px 10px; }
.stats b { display: block; font-family: var(--f-display); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.stats span { font-size: .74rem; color: var(--mute); }
.dsl { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; padding: 0; list-style: none; }
.dsl li { font-size: .76rem; background: var(--soft); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; color: var(--mute); }

/* play */
.hud { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.rno { font-family: var(--f-display); font-size: 1.35rem; font-weight: 700; }
.rtype { font-size: .74rem; text-transform: uppercase; letter-spacing: .09em; font-weight: 600; background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; }
.dots { display: flex; gap: 4px; flex: 1 1 140px; min-width: 120px; }
.dots i { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
.dots i.now { background: var(--blade); }
.dots i.done { background: var(--ok); }
.dots i.low { background: var(--warn); }
.dots i.skip { background: var(--mute); opacity: .5; }
.hud .sc { font-family: var(--f-mono); font-weight: 600; }
.ds { margin: 0 0 8px; font-size: .84rem; color: var(--mute); display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.ds b { color: var(--ink); font-family: var(--f-display); }
.why { font-size: .72rem; border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; background: var(--panel); }
.brief { margin: 0 0 10px; color: var(--mute); max-width: 76ch; }
.arena { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.arena.one { grid-template-columns: 1fr; }
.pane { margin: 0; background: var(--stage); border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; position: relative; min-width: 0; }
.pane figcaption { position: absolute; left: 10px; top: 8px; z-index: 2; display: flex; gap: 8px; align-items: baseline; pointer-events: none; font-size: .85rem; }
.pane figcaption b { font-family: var(--f-display); }
.pane canvas { display: block; width: 100%; height: min(62vh, 460px); touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none; }
.pane.rot canvas { cursor: grab; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
.nicks { display: inline-flex; gap: 4px; align-items: center; margin-left: auto; font-size: .8rem; color: var(--mute); }
.nicks i { width: 9px; height: 18px; border-radius: 2px; background: var(--blade); transform: skewX(-18deg); }
.nicks i.used { background: var(--line); }
.read { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px 14px; display: grid; gap: 6px; font-size: .92rem; }
.bar { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; position: sticky; bottom: 0; z-index: 5; padding-block: 10px calc(8px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to bottom, transparent, var(--bg) 35%); }
.bar .fb { flex: 1 1 100%; display: flex; gap: 12px; align-items: center; justify-content: space-between; border-radius: 12px; padding: 12px 14px; border: 1px solid transparent; }
.bar .fb > div { min-width: 0; }
.bar .fb b { display: block; font-family: var(--f-display); font-size: 1.15rem; }
.bar .fb span { font-size: .85rem; opacity: .9; }
.fb.good { background: var(--good-bg); color: var(--good-ink); border-color: var(--good-ink); }
.fb.mid { background: var(--mid-bg); color: var(--mid-ink); border-color: var(--mid-ink); }
.fb.bad { background: var(--bad-bg); color: var(--bad-ink); border-color: var(--bad-ink); }
.fb.info { background: var(--info-bg); color: var(--info-ink); border-color: var(--info-ink); }
.fb.star { background: var(--panel); color: var(--ink); border-color: var(--line); justify-content: flex-start; }
.fb.star > div { flex: 1; }
.fb .star-ico { width: 36px; height: 36px; flex: none; animation: starpop .6s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes starpop { from { transform: scale(.2) rotate(-50deg); opacity: 0; } to { transform: none; opacity: 1; } }
.hud .stars { color: var(--gold-edge); font-weight: 700; }
.dots i.star { background: var(--gold); }
.savelist { display: grid; gap: 4px; font-size: .84rem; margin: 6px 0 0; }
.savelist .btn { min-height: 28px; padding: 0 10px; font-size: .8rem; margin-left: 6px; }
.myrep { margin: 0 0 14px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--soft); padding: 8px 10px; }
.myrep summary { cursor: pointer; font-weight: 600; font-size: .88rem; }
.myr { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: .82rem; margin-top: 6px; }
.myr .acts { display: flex; gap: 6px; }
.myr .btn { min-height: 30px; padding: 2px 10px; font-size: .8rem; }
.board h3 { font-size: 1.1rem; margin-bottom: 2px; }
.board ol { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
.board li { display: grid; grid-template-columns: 1.8rem minmax(0, 1fr) auto auto; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: var(--r-s); background: var(--soft); font-size: .88rem; }
.board li.me { outline: 2px solid var(--gold); background: var(--panel); }
.board .rk { color: var(--mute); }
.board .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board .pts { font-weight: 700; }
.board .st { color: var(--mute); font-size: .76rem; white-space: nowrap; }
.board .star-sm { width: 13px; height: 13px; vertical-align: -2px; }
/* Drag-and-Match: tiles stacked into piles by dragging matching entries onto each other */
.dlfield { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; align-items: start; background: var(--stage); border: 1px solid var(--line); border-radius: var(--r-m); padding: 10px; min-height: 120px; }
.pile { background: var(--panel); border: 2px solid var(--line); border-radius: var(--r-m); padding: 4px; display: grid; gap: 4px; transition: border-color .12s ease, transform .12s ease; min-width: 0; }
.pile.multi { border-color: var(--blade); }
.pile.over { border-color: var(--hot); transform: scale(1.02); box-shadow: 0 0 0 3px color-mix(in srgb, var(--hot) 25%, transparent); }
.pile.flash { animation: pileflash .6s ease; }
@keyframes pileflash { 0% { box-shadow: 0 0 0 0 var(--gold); } 40% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--gold) 55%, transparent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.phead { display: flex; align-items: center; gap: 6px; font-family: var(--f-display); font-weight: 700; font-size: .86rem; padding: 2px 4px; }
.phead .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.phead.sel, .tile.sel { outline: 2px solid var(--hot); border-radius: 6px; }
.tile { display: grid; grid-template-columns: 24px 34px minmax(0, 1fr); gap: 6px; align-items: center; height: 30px; }
.tile .lab { font-family: var(--f-mono); font-size: .76rem; }
.tile canvas { width: 100%; height: 26px; display: block; border-radius: 4px; background: var(--panel); }
.dlfield .grip { font-family: var(--f-mono); letter-spacing: -3px; color: var(--mute); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; line-height: 1; text-align: center; font-size: 1.05rem; padding: 5px 0; }
.dlfield.pop .tile { animation: popin .42s cubic-bezier(.2, 1.4, .4, 1) backwards; }
.dl-ghost { position: fixed; z-index: 30; pointer-events: none; padding: 6px 12px; border: 2px solid var(--blade); border-radius: 10px; background: var(--info-bg); color: var(--info-ink); font-family: var(--f-mono); font-weight: 600; box-shadow: 0 8px 22px rgba(0, 0, 0, .28); transform: translate(-50%, -60%) rotate(-4deg); }
.sum .star-sm { width: 15px; height: 15px; vertical-align: -2px; margin-right: 5px; }
.sum .why-line { color: var(--mute); font-size: .76rem; line-height: 1.35; }
.fb .btn { flex: none; background: var(--ink); color: var(--bg); border-color: var(--ink); }
.key { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }

/* alignment rows, whack-a-mole */
.rowsbox { position: relative; background: var(--stage); border: 1px solid var(--line); border-radius: var(--r-m); padding: 8px; }
.rows { position: relative; display: grid; gap: 4px; touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
.arow { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; align-items: center; height: 28px; position: relative; transition: margin .18s ease; }
.arow .lab { font-family: var(--f-mono); font-size: .76rem; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.arow .lab span { overflow: hidden; text-overflow: ellipsis; }
.arow .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--line); flex: none; }
.arow canvas { width: 100%; height: 28px; display: block; border-radius: 4px; background: var(--panel); }
.pop .arow { animation: popin .42s cubic-bezier(.2, 1.4, .4, 1) backwards; }
@keyframes popin { from { transform: translateY(14px) scaleY(.15); opacity: 0; } to { transform: none; opacity: 1; } }
.arow.whack { animation: whack .34s ease; }
@keyframes whack { 0% { transform: none; } 25% { transform: translateX(-6px) scaleY(.82); } 55% { transform: translateX(5px) scaleY(1.06); } 100% { transform: none; } }
.arow.flag canvas { box-shadow: 0 0 0 2px var(--hot); }
.arow.flag .lab { color: var(--hot); font-weight: 600; }
.arow.flag::after { content: ""; position: absolute; left: 120px; right: 8px; top: 50%; height: 2px; background: linear-gradient(90deg, transparent, var(--hot) 20%, var(--hot) 80%, transparent); transform: rotate(-2deg); pointer-events: none; opacity: .85; }
.arow.gap-before { margin-top: 14px; }
.arow.ok canvas { box-shadow: 0 0 0 2px var(--ok); }
.arow.miss canvas { box-shadow: 0 0 0 2px var(--warn); }
.arow.bad canvas { box-shadow: 0 0 0 2px var(--hot); }
.arow .tag { position: absolute; right: 6px; top: -1px; font-size: .66rem; font-family: var(--f-mono); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.trail { position: absolute; inset: 0; pointer-events: none; width: 100%; height: 100%; }
.zoomrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 8px; font-size: .85rem; }
.zoomrow input[type="range"] { flex: 1 1 140px; min-width: 100px; accent-color: var(--blade); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .78rem; color: var(--mute); margin-top: 8px; }
.arow .grip { font-family: var(--f-mono); letter-spacing: -3px; color: var(--mute); cursor: grab; padding: 0 3px 0 0; flex: none; line-height: 1; }
.arow.reorder .lab { cursor: grab; touch-action: none; }
.arow.dragging { z-index: 4; opacity: .94; transition: none; box-shadow: 0 6px 18px rgba(0, 0, 0, .25); border-radius: 6px; background: var(--stage); cursor: grabbing; }
.dropline { position: absolute; left: 0; right: 0; height: 3px; border-radius: 2px; background: var(--blade); pointer-events: none; display: none; z-index: 5; }

/* naming: mystery model dragged onto a family card */
.nlayout { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.4fr); gap: 10px; margin-bottom: 10px; align-items: start; user-select: none; -webkit-user-select: none; }
.fams { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.ncard { background: var(--panel); border: 2px solid var(--line); border-radius: var(--r-m); padding: 8px; display: grid; gap: 6px; min-width: 0; position: relative; transition: border-color .12s ease, transform .12s ease; }
.ncard.target { border-color: var(--blade); position: sticky; top: 4px; }
.ncard header { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: .85rem; }
.ncard header b { font-family: var(--f-display); font-size: 1.02rem; }
.ncard canvas.mv { width: 100%; height: 128px; background: var(--stage); border-radius: 6px; touch-action: none; cursor: grab; }
.ncard.target canvas.mv { height: min(34vh, 280px); }
.ncard canvas.st { width: 100%; height: 22px; border-radius: 4px; background: var(--soft); }
.ncard .sim { font-family: var(--f-mono); font-size: .74rem; color: var(--mute); }
.ncard .refinfo { font-size: .76rem; color: var(--mute); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-height: 1.4em; }
.ncard .badge { font-size: .66rem; letter-spacing: .05em; text-transform: uppercase; border-radius: 4px; padding: 0 5px; border: 1px solid var(--line); background: var(--soft); }
.ncard .badge.exp { border-color: var(--ok); color: var(--ok); }
.ncard .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.ncard .acts .btn { min-height: 32px; padding: 4px 10px; font-size: .82rem; }
.ncard.over { border-color: var(--blade); transform: scale(1.02); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blade) 30%, transparent); }
.ncard.sel { border-color: var(--hot); }
.ncard.truth { border-color: var(--ok); box-shadow: 0 0 0 2px var(--ok); }
.ncard.none { border-style: dashed; background: var(--soft); align-content: start; }
.ncard.none p { margin: 0; font-size: .82rem; color: var(--mute); }
.ncard.none input[type="text"] { user-select: text; -webkit-user-select: text; min-height: 34px; font-size: .86rem; }
.chip { display: flex; align-items: center; gap: 10px; border: 2px dashed var(--blade); border-radius: 10px; padding: 6px 10px; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; background: var(--info-bg); color: var(--info-ink); font-weight: 600; font-size: .86rem; }
.chip canvas { width: 44px; height: 44px; border-radius: 6px; background: var(--stage); flex: none; }
.ghost { position: fixed; z-index: 30; pointer-events: none; width: 84px; height: 84px; border-radius: 12px; border: 2px solid var(--blade); background: var(--stage); box-shadow: 0 8px 22px rgba(0, 0, 0, .28); transform: translate(-50%, -60%) rotate(-5deg); }

/* end */
.end { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; align-items: start; }
.sum { display: grid; gap: 6px; }
.sum .r { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.sum .r small { display: block; color: var(--mute); font-size: .76rem; }
.mdbox { width: 100%; height: 360px; font-family: var(--f-mono); font-size: .76rem; background: var(--soft); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-s); padding: 10px; resize: vertical; }
.note { font-size: .85rem; color: var(--mute); }
.err { color: var(--hot); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 99px; font-size: .88rem; z-index: 40; max-width: 90vw; }
.loading { color: var(--mute); padding: 40px 0; text-align: center; }
@media (max-width: 760px) {
  .start, .end, .nlayout { grid-template-columns: 1fr; }
  .arena { grid-template-columns: 1fr; }
  .pane canvas { height: min(31vh, 250px); }
  .arow { grid-template-columns: 74px minmax(0, 1fr); }
  .arow.flag::after { left: 82px; }
  .brief { font-size: .88rem; margin-bottom: 8px; }
  .hud { gap: 6px 10px; }
  .rno { font-size: 1.15rem; }
  .hud #quit { min-height: 32px; padding: 3px 10px; font-size: .8rem; margin-left: auto; }
  .ncard.target { position: static; }
  .ncard.target canvas.mv { height: min(28vh, 220px); }
  .tools .btn, .tools .seg button { min-height: 36px; padding: 6px 10px; }
  .fams { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { .dlfield.pop .tile, .pile.flash { animation: none; } .fb .star-ico { animation: none; } .arow, .ncard { transition: none; } .pop .arow, .arow.whack { animation: none; } }
/* ---------------------------------------------------------------- cartridge skin: overrides that give the chrome its pixel look */
html { font-size: 21px; }
body { font-size: 1rem; line-height: 1.2; background-image: linear-gradient(rgba(255,255,255,.025) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.025) 2px, transparent 2px); background-size: 16px 16px; }
h1, h2, h3 { font-weight: 400; letter-spacing: 0; line-height: 1.5; }
b, strong { font-weight: 400; }
.read b, .note b { color: var(--gold); }

.est span { font-size: 16px; color: var(--mute); }

.check { display: flex; gap: 8px; align-items: center; }

<script>
"use strict";
/* ================================================================ helpers */
const $ = (s, e) => (e || document).querySelector(s);
const $$ = (s, e) => Array.from((e || document).querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const VERSION = "0.4 prototype";
const ROUNDS = 10, BUDGET = 8, MINPIECE = 4;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let RND = Math.random;
const pick = a => a[Math.floor(RND() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(RND() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function wpick(items, wf) { let t = 0; const w = items.map(x => { const v = Math.max(0, wf(x)); t += v; return v; }); if (!t) return pick(items); let r = RND() * t; for (let i = 0; i < items.length; i++) { r -= w[i]; if (r <= 0) return items[i]; } return items[items.length - 1]; }
function store(k, v) { try { if (v === undefined) { const s = localStorage.getItem("sd." + k); return s ? JSON.parse(s) : null; } localStorage.setItem("sd." + k, JSON.stringify(v)); } catch (e) { } return null; }
function toast(t) { const e = $("#toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => e.hidden = true, 2600); }
const nowS = () => Math.round(Date.now() / 1000);
const fmtT = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

/* ================================================================ capabilities */
const CAP = { user: null, db: null, dl: null, uid: null, canWrite: null };
const withTimeout = (p, ms) => Promise.race([Promise.resolve(p), new Promise(res => setTimeout(() => res(null), ms))]);
async function useCap(n) { try { return window.claude && claude.use ? await withTimeout(claude.use(n), 5000) : null; } catch (e) { return null; } }
async function initCaps() {                                              // anyone with the link can play; db, user and downloads only exist for some viewers
  const [u, d, dl] = await Promise.all([useCap("user"), useCap("db"), useCap("downloads")]); CAP.user = u; CAP.db = d; CAP.dl = dl;
  try { if (CAP.user && CAP.user.id) CAP.uid = await withTimeout(CAP.user.id(), 4000); } catch (e) { }
  try { if (CAP.user && CAP.user.can) CAP.canWrite = await withTimeout(CAP.user.can("data.write"), 4000); } catch (e) { }
}

/* ================================================================ the Bank
   What a player has earned here is spent in Petri Dash, which lives on this same page. With the lab database the Bank is kept on the player's account, as a ledger
   in sessions/<uid> with one entry per session (written by key, so saving a session twice cannot pay twice) and the Petri Dash save beside it. Without the database
   both are kept in this browser. */
const BANK = { mode: "browser", points: 0, stars: 0, n: 0, ready: false, subs: [] };
const onAccount = () => !!(CAP.db && CAP.uid && CAP.canWrite !== false);
function localLedger() {
  let l = store("bank");
  if (!l || !Array.isArray(l.starts)) { l = { points: 0, stars: 0, starts: [] }; localReports().forEach(r => { l.points += r.total || 0; l.stars += r.stars || 0; l.starts.push(r.start); }); store("bank", l); }
  return l;
}
function ledgerAdd(rep) { const l = localLedger(); if (l.starts.includes(rep.start)) return; l.starts.push(rep.start); l.points += rep.total || 0; l.stars += rep.stars || 0; store("bank", l); }
async function bankBackfill(ref, cur) {                                // sessions played before the Bank existed: one pass over this player's own reports
  const snap = await withTimeout(CAP.db.collection("sessions/" + CAP.uid + "/reports").get(), 20000); if (!snap) return null;
  const lg = Object.assign({}, cur.ledger); snap.docs.forEach(d => { const x = d.data(); if (x && x.start != null) lg["s" + x.start] = [x.total || 0, x.stars || 0]; });
  try { await ref.update({ ledger: lg, ledgerV: 1 }); } catch (e) { }
  return lg;
}
async function bankRefresh() {
  const l = localLedger(); let out = { mode: "browser", points: l.points, stars: l.stars, n: l.starts.length };
  if (onAccount()) try {
    const ref = CAP.db.doc("sessions/" + CAP.uid), snap = await withTimeout(ref.get(), 8000);
    if (snap) { const cur = snap.exists ? snap.data() || {} : {}; let lg = cur.ledger || {};
      if (snap.exists && !cur.ledgerV) lg = (await bankBackfill(ref, cur)) || lg;
      const sum = { mode: "account", points: 0, stars: 0, n: 0 }; Object.keys(lg).forEach(k => { sum.points += +lg[k][0] || 0; sum.stars += +lg[k][1] || 0; sum.n++; });
      localReports().forEach(x => { if (!x.synced && !lg["s" + x.start]) { sum.points += x.total || 0; sum.stars += x.stars || 0; sum.n++; } });   // finished here, not yet taken by the database
      out = sum; }
  } catch (e) { }
  Object.assign(BANK, out, { ready: true }); BANK.subs.forEach(f => { try { f(); } catch (e) { } }); renderBank();
}
function renderBank() {
  const dash = window.PDDASH, w = dash ? dash.wallet() : { points: BANK.points, stars: BANK.stars }, n = v => v.toLocaleString("en-US");
  const chip = $("#bankChip"); if (chip) chip.innerHTML = BANK.ready ? "Bank <b>" + n(w.points) + "</b> points · <b>" + w.stars + "</b> stars" : "Bank ...";
  const b = $("#toDash"); if (b) b.textContent = dash && dash.started() ? "Back to Petri Dash" : "Play Petri Dash";
  const ln = $("#bankLine"); if (ln && BANK.ready) { const who = store("alias");
    ln.innerHTML = "<b>Bank" + (who ? " of " + esc(who) : "") + ":</b> " + n(BANK.points) + " points and " + BANK.stars + " stars earned over " + BANK.n + (BANK.n === 1 ? " session" : " sessions") + ", kept " + (BANK.mode === "account" ? "on your account" : "in this browser") + ". To spend: " + n(w.points) + " points and " + w.stars + " stars."; }
}
/* Petri Dash reaches the Bank and its own save through this object */
const GAME = { timer: 0, busy: false, next: null };
const gameRef = () => onAccount() ? CAP.db.doc("sessions/" + CAP.uid + "/game/petridash") : null;
async function flushSave() {                                           // one write at a time, and only the newest save
  const ref = gameRef(); if (!ref || GAME.busy || GAME.next == null) return;
  const json = GAME.next; GAME.next = null; GAME.busy = true;
  try { await ref.set({ ts: Date.now(), json }); } catch (e) { }
  GAME.busy = false; if (GAME.next != null) flushSave();
}
let hostReady; const HOSTP = new Promise(res => hostReady = res);
window.PDHOST = {
  ready: HOSTP,
  bank: () => ({ mode: BANK.mode, points: BANK.points, stars: BANK.stars, n: BANK.n, ready: BANK.ready }),
  onBank: fn => BANK.subs.push(fn),
  writeSave(save) { GAME.next = JSON.stringify(save); clearTimeout(GAME.timer); GAME.timer = setTimeout(flushSave, 900); renderBank(); },
  async loadSave() { const ref = gameRef(); if (!ref) return null; try { const sn = await withTimeout(ref.get(), 8000), d = sn && sn.exists ? sn.data() : null; return d && d.json ? JSON.parse(d.json) : null; } catch (e) { return null; } },

    body += " " + (!first ? "You had already cleared this stage." : st.id === LAST ? "That is the last stage in this beta." : "The road to stage " + (st.id + 1) + " opens." + (tier || shelf.length ? " New on the shelf: " + [tier].concat(shelf).filter(Boolean).join(", ") + "." : ""));
  } else if (ui.losses === 2) { ui.phase = "over"; head = "STAGE " + st.id + " LOST, " + ui.wins + " HEATS TO " + ui.losses; body += " Earn points in the Vault, buy parts, or run it again."; }
  else ui.phase = "between";
  ui.fb = { cls, head, body }; renderHead(); renderCtl(); updateLive(); renderPane(); if (REDUCE) paint(0);
}

/* ================================================================ actions */
function buy(id) {
  const p = PD.PARTS.find(q => q.id === id), stt = p && partState(p); if (!stt || !stt.ok || ui.phase === "running") return;
  if (stt.pr.points) save.spent.points += stt.pr.points; if (stt.pr.stars) save.spent.stars += stt.pr.stars;
  if (p.tiers) save.tiers[p.id] = (save.tiers[p.id] || 0) + 1; else { save.owned[p.id] = true; if (p.module && !save.module) save.module = p.module; }
  ui.est = null; persist(); refreshLineup(); renderWallet(); renderPane();
}
function refreshLineup() { if (ui.phase === "idle" || ui.phase === "over") { ui.specs = null; if (ui.screen === "stage") renderStand(); } }
function runEstimate() {
  const b = $("#est"); if (b) { b.disabled = true; b.textContent = "Running 300 heats"; }
  setTimeout(() => { const st = stageNow(), e = PD.estimate(save, st, 300, Math.floor(Math.random() * 1e9)), spec = PD.playerSpec(save);
    ui.est = Object.assign(e, { stage: st.id, label: spec.maxHp + " health, runs of " + spec.run.toFixed(1) + " s" + (spec.module ? ", " + PD.MODULE_NAMES[spec.module].toLowerCase() : "") + (save.override ? ", stats overridden" : "") }); renderPane(); }, 30);
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("button"); if (!t || !ROOT.contains(t)) return; const d = t.dataset;
  if (t.id !== "reset" && ui.confirmReset) ui.confirmReset = false;
  if (d.pick) {
    if (save.starter && ui.confirmPick !== d.pick) { ui.confirmPick = d.pick; renderTitle(); return; }
    save = Object.assign(fresh(), { starter: d.pick, owned: Object.assign({}, PD.STARTERS[d.pick].own), gift: save.gift, earned: save.earned, banked: save.banked, tut: save.tut, tourDone: save.tourDone }); ui.confirmPick = null; persist(); ui.stage = -1; ui.est = null; ui.msg = save.tut ? "Walk to the first dot to begin." : "Start with the lab escape."; resetSeries(); go("map", true);
  }
  else if (t.id === "cont") { ui.confirmPick = null; if (NODES[save.at].stage !== undefined) ui.stage = NODES[save.at].stage; go("map", true); }
  else if (d.vault) { if (HOST) HOST.showVault(); }
  else if (d.show) { save.show[d.show] = save.show[d.show] === false; persist(); renderPane(); }
  else if (t.id === "showAll") { const mine = PD.PARTS.filter(p => p.tiers ? save.tiers[p.id] > 0 : save.owned[p.id]), on = !mine.some(p => save.show[p.id] !== false); mine.forEach(p => save.show[p.id] = on); persist(); renderPane(); }
  else if (t.id === "tourBtn") tourShow(0);
  else if (t.id === "enter") enterNode();
  else if (t.id === "toBank") { ui.tab = "shop"; ui.msg = ""; renderPane(); const rr = $("#recIn"); if (rr) try { rr.focus(); } catch (e) { } }
  else if (d.go) walkTo(save.at + (+d.go));
  else if (t.id === "run") startHeat();
  else if (t.id === "skip") finishNow();
  else if (t.id === "toMap") { if (ui.phase === "running") return; resetSeries(); ui.msg = ""; go("map", true); }
  else if (d.spd) { ui.speed = +d.spd; $$("#spd button").forEach(b => b.setAttribute("aria-pressed", String(b === t))); }
  else if (d.tab) { ui.tab = d.tab; renderPane(); }
  else if (d.mod !== undefined) { save.module = d.mod || null; ui.est = null; persist(); refreshLineup(); renderPane(); }
  else if (d.buy) buy(d.buy);
  else if (t.id === "est") runEstimate();
  else if (t.id === "toTitle") { if (ui.phase === "running") return; ui.walk = null; go("title"); }
  else if (t.id === "reset") { if (!ui.confirmReset) { ui.confirmReset = true; renderPane(); } else { ui.confirmReset = false; save = Object.assign(fresh(), { earned: save.earned, banked: save.banked, tut: save.tut, tourDone: save.tourDone }); persist(); ui.stage = -1; ui.est = null; ui.walk = null; resetSeries(); go("title"); } }
});
document.addEventListener("input", ev => {
  const t = ev.target; if (!ROOT.contains(t)) return;
  if (false) { }
});
document.addEventListener("keydown", ev => {
  if (ROOT.hidden || ui.screen !== "map" || ev.target.closest("input, textarea, select")) return;
  const k = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key];
  if (k) { ev.preventDefault(); keyMove(k); } else if ((ev.key === "Enter" || ev.key === " ") && !ev.target.closest("button")) { ev.preventDefault(); enterNode(); }
});
$("#world").addEventListener("click", ev => {
  const cv = ev.currentTarget, r = cv.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * WW, y = (ev.clientY - r.top) / r.height * WH; let best = -1, bd = 22;
  NODES.forEach((n, i) => { const dd = Math.hypot(n.x - x, n.y - y); if (dd < bd) { bd = dd; best = i; } });
  if (best < 0) return; if (best === save.at && !ui.walk) enterNode(); else walkTo(best);
});

/* ================================================================ one loop paints whatever screen is up */
function paint(t) { ui.t = t; drawPortraits(t); if (ui.screen === "map") drawWorld(t); else if (ui.screen === "stage") drawDish(t); }
let lastTs = 0;
function loop(ts) { const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0; lastTs = ts; ui.t = ts / 1000;
  if (!ROOT.hidden) { if (ui.screen === "map") stepWalk(dt); else if (ui.screen === "stage" && ui.phase === "running") raceStep(dt); paint(ui.t); }
  requestAnimationFrame(loop); }
window.addEventListener("resize", fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe($(".wrap"));
renderAll();
if (!REDUCE) requestAnimationFrame(loop);
/* inside the Vault page: the host tells the game when the Bank changes, and the save follows the account */
window.PDDASH = { wallet, started: () => !!save.starter, shown() { renderAll(); try { if (ui.screen === "map") $("#world").focus({ preventScroll: true }); } catch (e) { } } };
if (HOST) {
  HOST.onBank(() => { renderWallet(); if (ui.screen !== "title") renderPane(); });
  HOST.ready.then(() => HOST.loadSave()).then(r => {
    if (r && (r.ts || 0) > (save.ts || 0)) {                             // a newer cell was saved from another device
      save = normal(r); save.at = Math.max(0, Math.min(maxNode(), save.at | 0)); persist(true);
      ui.stage = NODES[save.at].stage; ui.est = null; ui.walk = null; resetSeries(); if (!save.starter) ui.screen = "title"; renderAll();
    } else if (save.starter && (!r || (save.ts || 0) > (r.ts || 0))) HOST.writeSave(save);
    renderWallet();
  }).catch(() => { });
}
})();
</script>
