<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Petri Dash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: three screens (title, overworld, stage). The overworld is one wide pixel canvas over a dialog box; the stage is the dish beside the cell / shop / lab pane.
   One visual world on purpose: a dark cartridge-era console, cream ink, coin-yellow accent, chunky black frames. All art is drawn in code on low-resolution canvases and scaled with hard pixels. */
:root {
  color-scheme: dark;
  --bg: #14112a; --bg2: #1c1838; --panel: #27224a; --panel2: #373067; --ink: #f6f1dd; --mute: #b8b1d6; --line: #5c5592; --edge: #090714;
  --gold: #ffd23f; --gold-d: #b87a0a; --on-gold: #2a1a00; --sky: #5ad1ff; --ok: #5be37d; --hot: #ff6b5d;
  --good-bg: #12402a; --good-ink: #a6f5c0; --bad-bg: #4a1a1a; --bad-ink: #ffc2b8; --info-bg: #1b2a5e; --info-ink: #c5d6ff;
  --f-display: "Press Start 2P", "Courier New", monospace; --f-body: "VT323", "Courier New", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 21px; line-height: 1.15; background-image: linear-gradient(rgba(255,255,255,.025) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.025) 2px, transparent 2px); background-size: 16px 16px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 14px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; line-height: 1.5; text-wrap: balance; }
h2 { font-size: 14px; } h3 { font-size: 12px; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; max-width: 100%; }
.mute, .note { color: var(--mute); }
.note { font-size: 18px; }
.card { background: var(--panel); border: 4px solid var(--edge); box-shadow: inset 4px 4px 0 rgba(255,255,255,.07), inset -4px -4px 0 rgba(0,0,0,.28); padding: 14px; }
.btn { font-family: var(--f-display); font-size: 10px; line-height: 1.4; text-transform: uppercase; padding: 10px 12px; min-height: 42px; background: var(--panel2); color: var(--ink); border: 4px solid var(--edge); box-shadow: inset -4px -4px 0 rgba(0,0,0,.35), inset 4px 4px 0 rgba(255,255,255,.14); }
.btn:hover:not(:disabled) { filter: brightness(1.15); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 4px 4px 0 rgba(0,0,0,.35); }
.btn.pri { background: var(--gold); color: var(--on-gold); }
.btn.big { font-size: 12px; padding: 14px 18px; min-height: 52px; }
.btn.sm { font-size: 8px; padding: 6px 8px; min-height: 32px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn small { display: block; font-family: var(--f-body); font-size: 16px; text-transform: none; opacity: .85; }
a.btn { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; text-decoration: none; }
.vault { display: grid; gap: 10px; padding: 12px; background: var(--panel2); border: 4px solid var(--edge); }
.vault h3 { color: var(--gold); }
.vault textarea { box-sizing: border-box; width: 100%; min-height: 76px; resize: vertical; font-family: var(--f-body); font-size: 16px; line-height: 1.2; padding: 8px; background: var(--edge); color: var(--ink); border: 2px solid var(--line); border-radius: 0; }
.bankmsg { font-size: 18px; min-width: 0; }
.bankmsg.ok { color: var(--ok); }
.bankmsg.bad { color: var(--hot); }
.btn:focus-visible, .seg button:focus-visible, input:focus-visible, textarea:focus-visible, canvas:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.seg { justify-self: start; max-width: 100%; display: inline-flex; flex-wrap: wrap; border: 4px solid var(--edge); background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 8px 10px; min-height: 38px; font-family: var(--f-display); font-size: 9px; text-transform: uppercase; }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); }
.seg button + button { border-left: 4px solid var(--edge); }

.top { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-size: 14px; color: var(--gold); text-shadow: 2px 2px 0 var(--gold-d); display: flex; align-items: center; gap: 10px; }
.tag { font-size: 8px; color: var(--mute); border: 2px solid var(--line); padding: 3px 6px; text-shadow: none; }
.wallet { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.coin { display: inline-flex; align-items: center; gap: 8px; background: var(--edge); border: 2px solid var(--line); padding: 4px 10px; font-size: 22px; }
.coin b { font-weight: 400; color: var(--gold); }
.ico { width: 14px; height: 14px; flex: none; }

/* title */
#title { display: grid; gap: 18px; justify-items: center; text-align: center; }
.logo { font-size: clamp(26px, 7.2vw, 64px); color: var(--gold); text-shadow: 4px 4px 0 #d9481f, 8px 8px 0 var(--edge); letter-spacing: 2px; line-height: 1.2; }
.sub { font-family: var(--f-display); font-size: clamp(8px, 1.6vw, 12px); color: var(--sky); line-height: 1.8; }
.blink { font-family: var(--f-display); font-size: 12px; color: var(--ink); animation: blink 1s steps(2, jump-none) infinite; }
@keyframes blink { 50% { opacity: .15; } }
.starters { display: grid; grid-template-columns: repeat(auto-fit, minmax(236px, 1fr)); gap: 14px; width: 100%; text-align: left; }
.starter { display: grid; gap: 10px; align-content: start; justify-items: start; }
.starter .stage { justify-self: stretch; display: grid; place-items: center; background: var(--edge); border: 2px solid var(--line); padding: 8px; background-image: radial-gradient(rgba(90,209,255,.18) 1px, transparent 1px); background-size: 8px 8px; }
.starter canvas { width: 216px; height: 144px; }
.starter h2 { font-size: 16px; color: var(--gold); }
.perk b { color: var(--sky); font-weight: 400; }
.cont { display: grid; gap: 8px; justify-items: center; }

/* stat rows */
.stats { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; width: 100%; }
.stats li { display: grid; grid-template-columns: minmax(0, 9.5rem) minmax(0, 1fr) 1.4rem; gap: 8px; align-items: center; font-size: 19px; }
.pips { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
.pips i { height: 10px; background: var(--edge); border: 1px solid var(--line); }
.pips i.b { background: var(--ink); border-color: var(--ink); }
.pips i.u { background: var(--sky); border-color: var(--sky); }
.stats .n { text-align: right; color: var(--gold); }

/* overworld */
.frame { justify-self: center; border: 4px solid var(--edge); box-shadow: 0 0 0 4px var(--line), 0 0 0 8px var(--edge); margin: 8px; max-width: calc(100% - 16px); background: #000; }
.reveal { animation: iris .7s steps(14, end) both; }
@keyframes iris { from { clip-path: circle(0% at 50% 45%); } to { clip-path: circle(120% at 50% 45%); } }
#world { cursor: pointer; touch-action: manipulation; }
.grid { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap: 14px; align-items: start; }
.col { display: grid; gap: 12px; min-width: 0; }
.dlg { display: grid; gap: 10px; }
.dlg h2 { color: var(--gold); }
.chip { justify-self: start; font-family: var(--f-display); font-size: 8px; padding: 4px 8px; border: 2px solid currentColor; }
.chip.ok { color: var(--ok); } .chip.open { color: var(--gold); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.msg { color: var(--hot); min-height: 1.2em; }

/* stage */
.hud { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.hud h2 { color: var(--gold); }
.heat { display: grid; justify-items: end; gap: 6px; flex: none; }
.heat .hp { display: flex; gap: 4px; }
.heat .hp i { width: 14px; height: 10px; background: var(--edge); border: 2px solid var(--line); }
.heat .hp i.w { background: var(--ok); border-color: var(--ok); }
.heat .hp i.l { background: var(--hot); border-color: var(--hot); }
#clock { font-family: var(--f-display); font-size: 12px; }
.dishframe { display: grid; place-items: center; background: var(--edge); border: 2px solid var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 0 0; padding: 0; list-style: none; font-size: 18px; }
.legend li { display: flex; gap: 6px; align-items: center; }
.legend canvas { width: 24px; height: 24px; border: 2px solid var(--edge); }
.legend span { color: var(--mute); }
.fb { padding: 10px 12px; border: 4px solid var(--edge); margin-top: 10px; }
.fb b { display: block; font-family: var(--f-display); font-size: 11px; font-weight: 400; line-height: 1.6; }
.fb.good { background: var(--good-bg); color: var(--good-ink); }
.fb.bad { background: var(--bad-bg); color: var(--bad-ink); }
.fb.info { background: var(--info-bg); color: var(--info-ink); }
.ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.stand { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.stand li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--panel); border: 4px solid var(--edge); padding: 6px 10px; }
.stand .who b { font-family: var(--f-display); font-size: 10px; font-weight: 400; }
.stand .who span { display: block; font-size: 17px; color: var(--mute); }
.stand .live { text-align: right; font-size: 17px; color: var(--mute); }
.stand .live b { display: block; color: var(--gold); font-weight: 400; font-size: 21px; }
.stand li.lead { border-color: var(--gold); }
.hpb { display: block; width: 70px; height: 7px; margin: 2px 0 2px auto; background: var(--edge); border: 1px solid var(--line); }
.hpb i { display: block; height: 100%; width: 100%; background: var(--ok); }
.dot { width: 12px; height: 12px; display: inline-block; flex: none; border: 2px solid var(--edge); }

/* pane */
.pane { display: grid; gap: 14px; }
.lab { font-family: var(--f-display); font-size: 8px; text-transform: uppercase; color: var(--mute); }
.field { display: grid; gap: 6px; }
.cellhead { display: flex; gap: 12px; align-items: center; }
.cellhead canvas { width: 108px; height: 72px; background: var(--edge); border: 2px solid var(--line); flex: none; }
.cellhead h3 { font-size: 14px; color: var(--gold); }
.shop { list-style: none; margin: 0; padding: 0; display: grid; }
.shop li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 8px 0; border-top: 2px dashed var(--line); }
.shop li:first-child { border-top: 0; padding-top: 0; }
.shop .fx { font-size: 17px; color: var(--mute); }
.shop .buy { display: grid; justify-items: end; gap: 3px; }
.shop .price { color: var(--gold); }
.shop .why { font-size: 16px; color: var(--mute); }
.shop .kind { font-family: var(--f-display); font-size: 7px; text-transform: uppercase; border: 2px solid var(--line); padding: 2px 4px; color: var(--mute); margin-left: 6px; vertical-align: middle; }
.est { background: var(--edge); border: 2px solid var(--line); padding: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.est b { display: block; font-family: var(--f-display); font-size: 14px; font-weight: 400; color: var(--gold); line-height: 1.6; }
.est span { font-size: 16px; color: var(--mute); }
.sliders { display: grid; gap: 6px; }
.sliders label { display: grid; grid-template-columns: minmax(0, 9.5rem) minmax(0, 1fr) 1.4rem; gap: 8px; align-items: center; font-size: 19px; }
.sliders input[type="range"] { width: 100%; accent-color: var(--gold); }
.check { display: flex; gap: 8px; align-items: center; }
.check input { width: 18px; height: 18px; accent-color: var(--gold); }
@media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .blink, .reveal { animation: none; } }
</style>

<div class="wrap">

      <span class="coin"><svg class="ico" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><path d="M3 0h1v2h3v1h-1v2h1v2h-1v-1h-1v-1h-1v1h-1v1h-1v-2h1v-2h-1v-1h3z" fill="#ffd23f"/></svg><b id="wStars">0</b> stars</span>
      <button class="btn" id="earn" type="button">Test top-up<small>+500 points, +10 stars</small></button>

    </div>
    <div class="card pane" id="pane"></div>
  </div>
</div>

  fitOne($("#dish"), 256, $("#dish").parentElement); const wf = $("#worldFrame"); wf.style.width = ""; const av = wf.parentElement.clientWidth - 24, s = av >= WW * 3 ? 3 : av >= WW * 2 ? 2 : av / WW; $("#world").style.width = Math.floor(WW * s) + "px";
}
function renderAll() {
  renderWallet(); ["title", "map", "stage"].forEach(s => $("#" + s).hidden = s !== ui.screen);
  const pw = $("#paneWrap"); pw.hidden = ui.screen === "title";
  if (ui.screen === "title") renderTitle();
  else { $(ui.screen === "map" ? "#slotMap" : "#slotStage").appendChild(pw); renderPane(); if (ui.screen === "map") renderNodeBox(); else { renderHead(); renderLegend(); renderCtl(); renderStand(); } fit(); }
  if (REDUCE) paint(0);
}
function go(screen, reveal) { ui.screen = screen; if (screen === "map" && ui.unlock) { if (REDUCE) ui.unlock = null; else ui.unlock.t0 = ui.t + 0.7; } renderAll(); if (reveal && !REDUCE) { const m = $("#" + screen); m.classList.remove("reveal"); void m.offsetWidth; m.classList.add("reveal"); } try { window.scrollTo(0, 0); if (screen === "map") $("#world").focus({ preventScroll: true }); } catch (e) { } }

/* ================================================================ walking the map */
function blocked() { ui.bump = ui.t; ui.msg = "The road is barred. Win stage " + maxNode() + " to open it."; renderNodeBox(); }
function walkTo(target) {
  const max = maxNode(); if (ui.walk) { ui.walk.final = target; return; }
  if (target > max) { if (save.at >= max) { blocked(); return; } target = max; }
  if (target === save.at || target < 0) return; ui.msg = ""; hop(target);
}
function hop(final) { const from = save.at, to = from + (final > from ? 1 : -1); if (REDUCE) { save.at = final; arrive(); return; } ui.walk = { from, to, final, s: 0, len: PPTS[Math.min(from, to)].length - 1 }; }
function stepWalk(dt) { const w = ui.walk; if (!w) return; w.s += dt * Math.max(64, w.len / 2.4); if (w.s < w.len) return; save.at = w.to; ui.walk = null; const max = maxNode(), fin = Math.min(w.final, max); if (w.final > max) ui.msg = "The road is barred. Win stage " + max + " to open it."; if (fin !== save.at) hop(fin); else arrive(); }
function arrive() { persist(); const nd = NODES[save.at]; if (!nd.home && ui.stage !== nd.stage) { ui.stage = nd.stage; ui.est = null; resetSeries(); } renderNodeBox(); renderPane(); if (REDUCE) paint(0); }
function keyMove(k) { let best = 0, bd = 0.25; for (const dir of [1, -1]) { const to = save.at + dir; if (to < 0 || to > 4) continue; const pp = PPTS[Math.min(save.at, to)], a = dir > 0 ? pp[0] : pp[pp.length - 1], b = dir > 0 ? pp[12] : pp[pp.length - 13], l = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, dp = ((b[0] - a[0]) * k[0] + (b[1] - a[1]) * k[1]) / l; if (dp > bd) { bd = dp; best = dir; } } if (best) walkTo(save.at + best); }
function enterNode() { if (ui.walk) return; const nd = NODES[save.at]; if (nd.home) { ui.tab = "shop"; ui.msg = ""; renderPane(); const r = $("#recIn"); if (r) try { r.focus(); } catch (e) { } } else { ui.stage = nd.stage; go("stage", true); } }

/* ================================================================ the race: best of three heats */
function resetSeries() { ui.race = null; ui.specs = null; ui.trails = []; ui.heat = 0; ui.wins = 0; ui.losses = 0; ui.phase = "idle"; ui.fb = null; }
function sample() { const r = ui.race; if (ui.steps++ % 5) return; r.cells.forEach((c, i) => { const tr = ui.trails[i]; tr.push(c.x, c.y); if (tr.length > 1800) tr.splice(0, 2); }); }
function startHeat() {
  if (ui.phase === "over" || ui.phase === "idle") { ui.heat = 0; ui.wins = 0; ui.losses = 0; }
  ui.heat++; ui.specs = PD.lineup(save, stageNow()); ui.race = PD.newRace(stageNow(), ui.specs, Math.floor(Math.random() * 2147483647));
  ui.trails = ui.specs.map(() => []); ui.steps = 0; ui.acc = 0; ui.phase = "running";
  ui.fb = { cls: "info", head: "HEAT " + ui.heat + " OF 3", body: "The cells run, tumble and follow the attractant. Nothing to do but watch." };
  renderHead(); renderCtl(); renderStand(); renderPane(); if (REDUCE) finishNow();
}
function raceStep(dt) { ui.acc += dt * ui.speed; let n = 0; while (ui.acc >= PD.DT && !ui.race.done && n < 40) { PD.step(ui.race); sample(); ui.acc -= PD.DT; n++; } if (ui.frame++ % 6 === 0) { updateLive(); renderHead(); } if (ui.race.done) heatDone(); }
function finishNow() { if (ui.phase !== "running") return; while (!ui.race.done) { PD.step(ui.race); sample(); } heatDone(); }
function heatDone() {
  const r = ui.race, st = stageNow(), won = r.winner === 0, wc = r.cells[r.winner], me = r.cells[0], secs = Math.round(r.t);
  if (won) ui.wins++; else ui.losses++;
  let cls = won ? "good" : "bad", head = "HEAT " + ui.heat + ": " + (won ? "YOU WON" : wc.spec.name.toUpperCase() + " WON");
  let body = r.timeout ? (r.t < PD.CAP - 0.1 ? "Every cell lysed before the goal. " : "Nobody reached the goal in 90 s. ") + (won ? "You were" : wc.spec.name + " was") + (wc.dead ? " the closest wreck." : " the closest survivor.")
    : won ? "Your " + me.spec.name + " reached the goal in " + secs + " s with " + Math.round(me.hp) + " health left." : me.dead ? "Your cell lysed " + (DIED[me.diedIn] || "on the way") + ". " + wc.spec.name + " reached the goal in " + secs + " s."
    : "It reached the goal in " + secs + " s. You were " + Math.round(PD.distGoal(me)) + " units short.";
  if (ui.wins === 2) {
    ui.phase = "over"; const first = save.won < st.id; if (first) { save.won = st.id; persist(); if (st.id < 4) ui.unlock = { seg: st.id, t0: 1e9 }; }
    head = "STAGE " + st.id + " WON, " + ui.wins + " HEATS TO " + ui.losses;
    body += " " + (!first ? "You had already cleared this stage." : st.id === 1 ? "The road to stage 2 opens. Tier 2 parts, switch tuning and the sodium stator set are on the shelf."
      : st.id === 2 ? "The road to stage 3 opens. Tier 3 parts and three more star parts are on the shelf." : st.id === 3 ? "The road to stage 4 opens as an experiment, and the surface motility modules are on the shelf." : "That is the last stage in this prototype.");
  } else if (ui.losses === 2) { ui.phase = "over"; head = "STAGE " + st.id + " LOST, " + ui.wins + " HEATS TO " + ui.losses; body += " Bank a Vault session, buy parts, or run it again."; }
  else ui.phase = "between";
  ui.fb = { cls, head, body }; renderHead(); renderCtl(); updateLive(); renderPane(); if (REDUCE) paint(0);
}

/* ================================================================ actions */
function buy(id) {
  const p = PD.PARTS.find(q => q.id === id), stt = p && partState(p); if (!stt || !stt.ok || ui.phase === "running") return;
  if (stt.pr.points) save.points -= stt.pr.points; if (stt.pr.stars) save.stars -= stt.pr.stars;
  if (p.tiers) save.tiers[p.id] = (save.tiers[p.id] || 0) + 1; else { save.owned[p.id] = true; if (p.module && !save.module) save.module = p.module; }
  ui.est = null; persist(); refreshLineup(); renderWallet(); renderPane();
}
function refreshLineup() { if (ui.phase === "idle" || ui.phase === "over") { ui.specs = null; if (ui.screen === "stage") renderStand(); } }
function runEstimate() {
  const b = $("#est"); if (b) { b.disabled = true; b.textContent = "Running 300 heats"; }
  setTimeout(() => { const st = stageNow(), e = PD.estimate(save, st, 300, Math.floor(Math.random() * 1e9)), spec = PD.playerSpec(save);
    ui.est = Object.assign(e, { stage: st.id, label: spec.maxHp + " health, runs of " + spec.run.toFixed(1) + " s" + (spec.module ? ", " + PD.MODULE_NAMES[spec.module].toLowerCase() : "") + (save.override ? ", stats overridden" : "") }); renderPane(); }, 30);
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("button"); if (!t) return; const d = t.dataset;
  if (t.id !== "reset" && ui.confirmReset) ui.confirmReset = false;
  if (d.pick) {
    if (save.starter && ui.confirmPick !== d.pick) { ui.confirmPick = d.pick; renderTitle(); return; }
    save = Object.assign(fresh(), { starter: d.pick, points: save.points, stars: save.stars, banked: save.banked || [] }); ui.confirmPick = null; persist(); ui.stage = 0; ui.est = null; ui.msg = "Walk to the first dot to begin."; resetSeries(); go("map", true);
  }
  else if (t.id === "cont") { ui.confirmPick = null; if (NODES[save.at].stage !== undefined) ui.stage = NODES[save.at].stage; go("map", true); }
  else if (t.id === "earn") { save.points += 500; save.stars += 10; persist(); renderWallet(); if (ui.screen !== "title") renderPane(); }
  else if (t.id === "enter") enterNode();
  else if (t.id === "bank") bankRecord();
  else if (d.go) walkTo(save.at + (+d.go));
  else if (t.id === "run") startHeat();
  else if (t.id === "skip") finishNow();
  else if (t.id === "toMap") { if (ui.phase === "running") return; resetSeries(); ui.msg = ""; go("map", true); }
  else if (d.spd) { ui.speed = +d.spd; $$("#spd button").forEach(b => b.setAttribute("aria-pressed", String(b === t))); }
  else if (d.tab) { ui.tab = d.tab; renderPane(); }
  else if (d.mod !== undefined) { save.module = d.mod || null; ui.est = null; persist(); refreshLineup(); renderPane(); }
  else if (d.buy) buy(d.buy);
  else if (t.id === "est") runEstimate();
  else if (t.id === "toTitle") { if (ui.phase === "running") return; ui.walk = null; go("title"); }
  else if (t.id === "reset") { if (!ui.confirmReset) { ui.confirmReset = true; renderPane(); } else { ui.confirmReset = false; save = fresh(); persist(); ui.stage = 0; ui.est = null; ui.walk = null; resetSeries(); go("title"); } }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "recIn") { ui.recDraft = t.value; ui.bank = null; }
  else if (t.id === "ovr") { save.override = t.checked ? Object.assign({ run: PD.playerSpec(save).run }, PD.playerSpec(save).stats) : null; ui.est = null; persist(); refreshLineup(); renderPane(); }
  else if (t.dataset && t.dataset.sl && save.override) { save.override[t.dataset.sl] = t.dataset.sl === "run" ? +t.value / 10 : +t.value; $("#sv-" + t.dataset.sl).textContent = t.value; ui.est = null; persist(); refreshLineup(); }
});
document.addEventListener("keydown", ev => {
  if (ui.screen !== "map" || ev.target.closest("input, textarea, select")) return;
  const k = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key];
  if (k) { ev.preventDefault(); keyMove(k); } else if ((ev.key === "Enter" || ev.key === " ") && !ev.target.closest("button")) { ev.preventDefault(); enterNode(); }
});
$("#world").addEventListener("click", ev => {
  const cv = ev.currentTarget, r = cv.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * WW, y = (ev.clientY - r.top) / r.height * WH; let best = -1, bd = 22;
  NODES.forEach((n, i) => { const dd = Math.hypot(n.x - x, n.y - y); if (dd < bd) { bd = dd; best = i; } });
  if (best < 0) return; if (best === save.at && !ui.walk) enterNode(); else walkTo(best);
});

/* ================================================================ one loop paints whatever screen is up */
function paint(t) { ui.t = t; drawPortraits(t); if (ui.screen === "map") drawWorld(t); else if (ui.screen === "stage") drawDish(t); }
let lastTs = 0;
function loop(ts) { const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0; lastTs = ts; ui.t = ts / 1000;
  if (ui.screen === "map") stepWalk(dt); else if (ui.screen === "stage" && ui.phase === "running") raceStep(dt);
  paint(ui.t); requestAnimationFrame(loop); }
window.addEventListener("resize", fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe($(".wrap"));
renderAll();
if (!REDUCE) requestAnimationFrame(loop);
</script>
